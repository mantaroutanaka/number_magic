1;min-width:0;position:relative;border-radius:5px;background:rgba(255,255,255,.14);display:grid;place-items:center}.cell+.cell:before{content:"";height:78%;width:1px;background:rgba(32,59,62,.24);position:absolute;left:-1px;top:11%}.cell-dot{height:clamp(6px,1.5vw,11px);width:clamp(6px,1.5vw,11px);background:rgba(255,255,255,.84);border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}.placed.is-selected{outline:4px solid #e49c2c;outline-offset:2px}.bridge-hint{font-size:12px;font-weight:800;text-align:center;color:#55747d;margin-top:11px;position:relative;z-index:1}.shelf-caption{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.shelf-caption h2{font-size:17px;margin:0}.shelf-caption span{font-size:12px;color:#637a7b;font-weight:700}.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.tray-piece{border:2px solid #d8e6df;background:#fff;border-radius:14px;min-height:91px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:9px 3px;box-shadow:0 4px 0 #e0eae3;touch-action:none;user-select:none;color:#214048;cursor:grab}.tray-piece:active{cursor:grabbing}.tray-piece .rod{width:min(100%,110px);display:flex;gap:1px;background:var(--piece-color);padding:4px;border-radius:6px;height:29px}.tray-piece .rod span{flex:1;min-width:0;border-radius:3px;background:rgba(255,255,255,.4)}.tray-piece .length{font-size:15px;font-weight:950}.tray-piece:disabled{opacity:.28;cursor:not-allowed}.empty-shelf{padding:18px 10px;text-align:center;border:2px dashed #d1ded5;border-radius:14px;color:#5f7c7b;font-weight:850}.game-tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px;border-top:2px dashed #e3e7db;padding-top:19px}.tool{border:2px solid #e0e8db;background:#f8faf2;color:#526b67;border-radius:14px;padding:10px 13px;font-size:14px;font-weight:850;min-height:44px}.hint-panel,.feedback{margin-top:14px;border-radius:17px;padding:14px 16px;font-weight:800}.hint-panel{background:#f @media(max-width:650px){.appwrap{width:calc(100% - 22px);padding-top:14px}.hero{padding:23px;min-height:245px}.hero h1{max-width:68%}.hero p{max-width:78%;font-size:14px}.hero-mascot{right:12px;top:20px;font-size:67px}.stage-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stage-card{padding:10px;min-height:105px}.stage-card .title{font-size:12px}.stage-card .num{font-size:22px}.btn{padding:12px 17px;font-size:15px}.tray{gap:5px}.tray-piece{min-height:84px}.mascot-talk .face{font-size:35px}.sea{padding:18px 10px}.bridge-track{min-height:70px}.placed{padding:5px 0}.chip{padding:7px 10px}.brand{font-size:19px}.brand-bubble{width:43px;height:43px;font-size:22px}}@media(max-width:360px){.hero h1{font-size:27px}.stage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head-right .chip{display:none}.tool{padding:8px 10px;font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

<body><main id="app"></main>
<script>
'use strict';
/* v0.1 — すべて端末上で実行し、外部通信は行いません。 */
const STAGES=[
 {id:1,area:'もり',name:'はじめての はし',prompt:'3この はしを つくってみよう！',target:3,initial:[],tray:[1,2],goal:{type:'fill'},hint:'「1こ」と「2こ」を つなげると どうなるかな？'},
 {id:2,area:'もり',name:'4この はし',prompt:'2ついじょう つかって 4こに しよう！',target:4,initial:[],tray:[1,2,3],goal:{type:'min',pieces:2},hint:'「2こ」を 2つ つかうと どうなるかな？'},
 {id:3,area:'もり',name:'5への みち',prompt:'2つの ブロックで 5こに しよう！',target:5,initial:[],tray:[1,2,3,4],goal:{type:'exact',pieces:2},hint:'「1と4」や「2と3」を ためそう。'},
 {id:4,area:'かわ',name:'あいてる ところ',prompt:'もう 2こ あるよ。あと いくつ？',target:5,initial:[2],tray:[1,2,3,4],goal:{type:'fill'},hint:'5こになるまで あと いくつ いるかな？'},
 {id:5,area:'かわ',name:'3つで つくろう',prompt:'3つの ブロックで 5こを つくろう！',target:5,initial:[],tray:[1,2,3,4],goal:{type:'exact',pieces:3},hint:'小さな ブロックを くみあわせてみよう。'},
 {id:6,area:'かわ',name:'はんぶんこ',prompt:'5この ブロックを 2つに わけよう！',target:5,initial:[5],tray:[],goal:{type:'exact',pieces:2},hint:'あおい ブロックを タップして、わけてみよう。'},
 {id:7,area:'かわ',name:'もっと わけよう',prompt:'5この ブロックを 3つに わけよう！',target:5,initial:[5],tray:[],goal:{type:'exact',pieces:3},hint:'いちど わけた ブロックも、もういちど わけられるよ。'},
 {id:8,area:'とう',name:'10の とびら',prompt:'2つの ブロックで 10こに しよう！',target:10,initial:[],tray:[1,2,3,4,5],goal:{type:'exact',pieces:2},hint:'5こ と 5こ を つなげたら どうなるかな？'},
 {id:9,area:'とう',name:'のこりは いくつ',prompt:'4この つづきから、3つの ブロックで 10こに しよう！',target:10,initial:[4],tray:[1,2,3,4,5],goal:{type:'exact',pieces:3},hint:'のこりは 6こ。2つの ブロックで 6こを つくろう。'},
 {id:10,area:'とう',name:'10を わけよう',prompt:'10この ブロックを 5こと 5こに わけよう！',target:10,initial:[10],tray:[],goal:{type:'pair',values:[5,5]},hint:'10この ブロックを タップして、まんなかで わけよう。'},
 {id:11,area:'とう',name:'3つの たから',prompt:'10この ブロックを 3つに わけよう！',target:10,initial:[10],tray:[],goal:{type:'exact',pieces:3},hint:'わけた あと、もう いちど わけてみよう。'},
 {id:12,area:'とう',name:'ひらめき めいじん',prompt:'10こを 3とおりの つくりかたで つくろう！',target:10,initial:[],tray:[1,2,3,4,5],goal:{type:'ways',count:3},hint:'おなじ かずでも、ちがう ブロックの くみあわせが あるよ。'}
];
const KEY='kazu-island-progress-v1';
const palettes=['#6cadd9','#f6b957','#82c9a0','#bdabed','#f3a2a2','#80c9c9'];
const app=document.getElementById('app');
const safeParse=(s,defaultValue)=>{try{return JSON.parse(s)||defaultValue}catch{return defaultValue}};
const readProgress=()=>{try{return safeParse(localStorage.getItem(KEY),{completed:[],last:1})}catch{return {completed:[],last:1}}};
let progress=readProgress();
progress.completed=Array.isArray(progress.completed)?progress.completed.filter(n=>Number.isInteger(n)&&n>=1&&n<=12):[];
progress.last=(Number.isInteger(progress.last)&&progress.last>=1&&progress.last<=12)?progress.last:1;
let state={screen:'home',mode:'stage',stage:1,target:5,pieces:[],moves:[],ways:[],modal:null,hint:false,feedback:'',feedbackType:'',win:false,freeTarget:5};
let soundOn=false,audioCtx=null,drag=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function E(s){return esc(s)}
function newPiece(n){return {len:n,color:palettes[Math.floor(Math.random()*palettes.length)]}}
function startingPieces(level){return level.initial.map((n,i)=>({len:n,color:palettes[i%palettes.length]}))}
function sum(){return state.pieces.reduce((a,p)=>a+p.len,0)}
function level(){return state.mode==='free'?{name:'じゆうに あそぼう',prompt:'すきな ブロックで あそんでね！',target:state.freeTarget,initial:[],tray:[1,2,3,4,5],goal:{type:'none'},hint:'くっつけたり、わけたり、なんどでも ためそう。'}:STAGES[state.stage-1]}
function unlocked(){return Math.min(12,Math.max(1,progress.completed.length?Math.max(...progress.completed)+1:1))}
function playSound(type='click') {if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const now=audioCtx.currentTime;let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(type==='win'?523:330,now);if(type==='win')osc.frequency.exponentialRampToValueAtTime(783,now+.17);gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.0001,now+(type==='win'?.4:.12));osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+(type==='win'?.4:.12))}catch{}}
function header(isGame=false){return `<header class="head"><div class="brand"><span class="brand-bubble" aria-hidden="true">🦕</span><span>数の魔法</span></div><div class="head-right"><span class="chip">⭐ ${progress.completed.length} / 12</span><button class="iconbtn" type="button" data-action="sound" aria-label="音を${soundOn?'消す':'出す'}">${soundOn?'🔊':'🔇'} おと</button></div></header>`}
function renderHome(){let next=unlocked();app.innerHTML=`<div class="appwrap">${header()}<section class="hero"><div class="eyebrow">さわって ひらめく さんすう</div><div class="hero-mascot" aria-hidden="true">🦕</div><h1>かずの<br>ぼうけんに でよう！</h1><p>ブロックを くっつけたり、わけたり。じぶんで ためして、はしを つくろう！</p><div class="actions"><button class="btn btn-primary" data-action="start" type="button">${progress.completed.length?'つづきから':'あそびはじめる'} ▶</button><button class="btn btn-secondary" data-action="free" type="button">じゆうに あそぶ ✨</button></div></section><section class="section-heading"><h2>🗺️ しまの ちず</h2><span>${progress.completed.length} / 12 ステージ クリア</span></section><div class="stage-grid">${STAGES.map(s=>{let done=progress.completed.includes(s.id),locked=s.id>next;return `<button class="stage-card ${locked?'locked':''}" ${locked?'disabled':''} type="button" data-action="stage" data-stage="${s.id}" aria-label="ステージ${s.id} ${E(s.name)} ${locked?'まだ遊べません':done?'クリア済み':'遊べます'}"><div class="num">${locked?'🔒':String(s.id).padStart(2,'0')} <span class="done">${done?'★':''}</span></div><div class="title">${E(s.name)}</div><div class="mini">${s.area==='もり'?'🌳 もり':s.area==='かわ'?'🌊 かわ':'🏰 とう'}</div></button>`}).join('')}</div><div class="footer-note">広告なし・課金なし・ログイン不要。あそんだ きろくは この端末だけに のこります。<br>おとなのかたへ：いっしょに「ほかの やりかたは ある？」と きいてみてください。</div></div>`}
function piecesHTML(){const occupied=sum();let res='';state.pieces.forEach((p,i)=>{res+=`<button type="button" class="placed" data-action="edit" data-index="${i}" style="--length:${p.len};--piece-color:${p.color}" aria-label="${p.len}このブロック。タップすると分けたり、くっつけたりできます。" title="タップして わける・くっつける">${Array.from({length:p.len},()=>'<span class="cell"><span class="cell-dot"></span></span>').join('')}</button>`});for(let i=occupied;i<level().target;i++)res+='<span class="segment-empty" aria-hidden="true"></span>';return res}
function trayHTML(){const lv=level();return lv.tray.length?`<div class="tray">${lv.tray.map((n,i)=>`<button type="button" class="tray-piece" data-action="put" data-size="${n}" aria-label="${n}このブロックを置く" style="--piece-color:${palettes[i%palettes.length]}" ${sum()+n>lv.target||state.win?'disabled':''}><span class="rod" aria-hidden="true">${Array.from({length:n},()=>'<span></span>').join('')}</span><span class="length">${n}こ</span></button>`).join('')}</div>`:'<div class="empty-shelf">👆 はしの ブロックを タップして わけよう！</div>'}
function successHTML(){let lv=level(),isWays=lv.goal.type==='ways';if(!state.win&&!isWays)return '';if(isWays&&state.ways.length>0&&!state.win)return `<div class="success-box"><div style="font-size:33px">🌟</div><h2>${state.ways.length}つ め みつけた！</h2><p>${state.ways.length} / 3 とおり できたよ。ほかの くみあわせも さがそう！</p><button class="btn btn-primary" data-action="again" type="button">ちがう つくりかた ▶</button></div>`;if(!state.win)return '';return `<div class="success-box" role="status"><div style="font-size:40px">🎉🦕</div><h2>${state.stage===12?'ひらめき めいじん！':'やったね！ クリア！'}</h2><p>じぶんで ためして できたね！<br>ほかの つくりかたも あるかも？</p><div class="actions"><button class="btn btn-secondary" type="button" data-action="retry">もういちど</button><button class="btn btn-primary" type="button" data-action="next">${state.stage<12?'つぎの ステージ ▶':'しまの ちずへ'}</button></div></div>`}
function editorHTML(){if(state.modal===null)return '';let i=state.modal,p=state.pieces[i];if(!p)return '';let cuts=Array.from({length:p.len-1},(_,j)=>j+1);let hasNext=i<state.pieces.length-1;return `<div class="modal-scrim" data-action="close" role="presentation"><section class="editor" role="dialog" aria-modal="true" aria-label="ブロックをわける・くっつける"><div class="editor-header"><h2>🧩 ${p.len}こ の ブロック</h2><button class="iconbtn" data-action="close" aria-label="閉じる">✕</button></div><p style="margin:8px 0 0;font-weight:800">どこで わける？</p><div class="cut-options">${cuts.length?cuts.map(k=>`<button class="cut-option" data-action="cut" data-index="${i}" data-cut="${k}">${k} ｜ ${p.len-k}</button>`).join(''):'<span style="grid-column:span 3;color:#768">1こは これいじょう わけられないよ</span>'}</div><div class="editor-actions"><button class="tool" data-action="join" data-index="${i}" ${!hasNext?'disabled':''}>→ みぎと くっつける</button><button class="tool" data-action="remove" data-index="${i}" ${level().tray.length===0?'disabled':''}>↩ はしから はずす</button></div><p style="margin:15px 0 0;color:#65807c;font-size:13px">くっつけても、わけても、ぜんぶの かずは おなじだよ。</p></section></div>`}
function renderGame(){const lv=level(),free=state.mode==='free';app.innerHTML=`<div class="appwrap">${header(true)}<nav class="game-top"><button class="iconbtn" type="button" data-action="home">← しまの ちず</button><span class="game-progress">${free?'じゆう モード':`ステージ ${state.stage} / 12`}</span></nav><section class="game-card"><div class="game-titleline"><div><span class="game-label">${free?'じゆうに ためそう':lv.area==='もり'?'🌳 はじまりの もり':lv.area==='かわ'?'🌊 5の かわ':'🏰 10の とう'}</span><h1>${E(lv.name)}</h1></div><span style="font-size:31px" aria-hidden="true">${free?'🧩':lv.area==='とう'?'🏰':'🦕'}</span></div><div class="mascot-talk"><div class="face" aria-hidden="true">🦕</div><div class="speech">${E(lv.prompt)}</div></div>${free?`<div class="free-switch"><button type="button" class="switch ${state.freeTarget===5?'active':''}" data-action="free-target" data-target="5">5こ の はし</button><button type="button" class="switch ${state.freeTarget===10?'active':''}" data-action="free-target" data-target="10">10こ の はし</button></div>`:''}<div class="sea"><div class="bridge-caption"><span>🌴 はしを つくろう 🌴</span><span class="count">${sum()} / ${lv.target} こ</span></div><div class="bridge-track" id="bridge-track" style="--target:${lv.target}" aria-label="${lv.target}このうち${sum()}こ置いています">${piecesHTML()}</div><div class="bridge-hint">${state.pieces.length?'うえの ブロックを タップ → わける・くっつける':'したの ブロックを タップ または はこぼう'}</div></div><div class="shelf-caption"><h2>🧺 ブロックおきば</h2><span>タップ または ドラッグ</span></div>${trayHTML()}<div class="game-tools"><button class="tool" data-action="undo" type="button" ${state.moves.length===0||state.win?'disabled':''}>↶ ひとつ もどす</button><button class="tool" data-action="reset" type="button">⟳ はじめから</button><button class="tool" data-action="hint" type="button">💡 ${state.hint?'ヒントを とじる':'ヒント'}</button></div>${state.hint?`<div class="hint-panel" role="status">💡 ${E(lv.hint)}</div>`:''}${state.feedback?`<div class="feedback ${state.feedbackType==='info'?'info':''}" role="status">${E(state.feedback)}</div>`:''}${free?`<div class="feedback info">${sum()===lv.target?'✨ ぴったり！ ほかの やりかたも ためそう。':'すきな かずを つくってみてね。'} 「わける」「くっつける」も できるよ。</div>`:successHTML()}</section><div class="footer-note">あせらなくて だいじょうぶ。なんどでも ためしてみよう！</div></div>${editorHTML()}`}
function render(){if(state.screen==='home')renderHome();else renderGame()}
function enter(stage){state={...state,screen:'game',mode:'stage',stage,modal:null,target:STAGES[stage-1].target,pieces:startingPieces(STAGES[stage-1]),moves:[],ways:[],hint:false,feedback:'',win:false};progress.last=stage;save();render();scrollToTop()}
function enterFree(){state={...state,screen:'game',mode:'free',freeTarget:5,modal:null,pieces:[],moves:[],ways:[],hint:false,feedback:'',win:false};render();scrollToTop()}
function scrollToTop(){window.scrollTo({top:0,behavior:'instant'})}
function snapshot(){state.moves.push({pieces:state.pieces.map(x=>({...x})),ways:state.ways.map(x=>x.slice()),win:state.win});if(state.moves.length>50)state.moves.shift()}
function clearFeedback(){state.feedback='';state.feedbackType=''}
function addPiece(n,pointX){if(state.win)return;const lv=level();if(!lv.tray.includes(n))return;if(sum()+n>lv.target){state.feedback='いっぱいに なるよ。ちいさな ブロックを ためそう！';state.feedbackType='info';render();return}snapshot();let p=newPiece(n);if(Number.isFinite(pointX)){let board=document.getElementById('bridge-track');let r=board.getBoundingClientRect();let pos=(pointX-r.left)/r.width*lv.target;let tally=0,idx=state.pieces.length;for(let i=0;i<state.pieces.length;i++){tally+=state.pieces[i].len;if(pos<tally){idx=i;break}}state.pieces.splice(idx,0,p)}else state.pieces.push(p);playSound();clearFeedback();evaluate();render()}
function cutPiece(index,cut){let p=state.pieces[index];if(!p||cut<=0||cut>=p.len||state.win)return;snapshot();let first={len:cut,color:p.color},second={len:p.len-cut,color:palettes[(index+state.moves.length+2)%palettes.length]};state.pieces.splice(index,1,first,second);state.modal=null;clearFeedback();playSound();evaluate();render()}
function joinPiece(index){if(index<0||index>=state.pieces.length-1||state.win)return;snapshot();let n=state.pieces[index].len+state.pieces[index+1].len;state.pieces.splice(index,2,{len:n,color:state.pieces[index].color});state.modal=null;clearFeedback();playSound();evaluate();render()}
function removePiece(index){if(index<0||index>=state.pieces.length||!level().tray.length||state.win)return;snapshot();state.pieces.splice(index,1);state.modal=null;clearFeedback();playSound();evaluate();render()}
function canonical(a){return a.slice().sort((x,y)=>x-y).join('+')}
function evaluate(){const lv=level(),goal=lv.goal;if(state.mode==='free'||sum()!==lv.target)return;let passed=false;switch(goal.type){case 'fill':passed=true;break;case 'min':passed=state.pieces.length>=goal.pieces;break;case 'exact':passed=state.pieces.length===goal.pieces;break;case 'pair':passed=canonical(state.pieces.map(p=>p.len))===canonical(goal.values);break;case 'ways':{let nums=state.pieces.map(p=>p.len),way=canonical(nums);if(state.ways.some(x=>canonical(x)===way)){state.feedback='これは まえにも つくったよ！ ほかの くみあわせを さがそう。';state.feedbackType='info';return}state.ways.push(nums);if(state.ways.length>=goal.count)passed=true;else{playSound('win');return}break}}
 if(passed){state.win=true;playSound('win');if(!progress.completed.includes(lv.id))progress.completed.push(lv.id);save()}else{state.feedback='かずは ぴったり！ ブロックの かずも かえてみよう。';state.feedbackType='info'}
}
function handleAction(action,button){const index=Number(button.dataset.index);switch(action){case 'sound':soundOn=!soundOn;playSound();render();break;case 'home':state.screen='home';state.modal=null;render();scrollToTop();break;case 'start':enter(unlocked());break;case 'stage':enter(Number(button.dataset.stage));break;case 'free':enterFree();break;case 'edit':if(!state.win){state.modal=index;render()}break;case 'close':state.modal=null;render();break;case 'cut':cutPiece(index,Number(button.dataset.cut));break;case 'join':joinPiece(index);break;case 'remove':removePiece(index);break;case 'undo':{if(!state.moves.length||state.win)break;let prev=state.moves.pop();state.pieces=prev.pieces;state.ways=prev.ways;state.win=prev.win;state.modal=null;clearFeedback();render();break}case 'reset':case 'retry':{state.pieces=state.mode==='free'?[]:startingPieces(level());state.moves=[];state.ways=[];state.win=false;state.modal=null;state.hint=false;clearFeedback();render();break}case 'hint':state.hint=!state.hint;render();break;case 'next':state.stage<12?enter(state.stage+1):(state.screen='home',render(),scrollToTop());break;case 'again':state.pieces=[];state.moves=[];clearFeedback();render();break;case 'free-target':state.freeTarget=Number(button.dataset.target);state.pieces=[];state.moves=[];state.ways=[];clearFeedback();render();break;case 'put':addPiece(Number(button.dataset.size));break}}
app.addEventListener('click',event=>{if(drag&&drag.skipNextClick){drag.skipNextClick=false;return}let button=event.target.closest('[data-action]');if(!button||button.disabled)return;if(button.dataset.action==='close'&&event.target.closest('.editor')&&event.target===button.closest('.modal-scrim'))return;if(button.dataset.action==='close'&&event.target.closest('.editor')&&!event.target.closest('.iconbtn'))return;handleAction(button.dataset.action,button)});
// Pointer-driven drag and drop for touch + mouse. Tapping a tray button also works.
app.addEventListener('pointerdown',e=>{const source=e.target.closest('.tray-piece');if(!source||source.disabled||e.button!==0)return;drag={id:e.pointerId,n:Number(source.dataset.size),x:e.clientX,y:e.clientY,moved:false,skipNextClick:false,ghost:null};});
window.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;let distance=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(distance>8&&!drag.moved){drag.moved=true;let el=document.createElement('div');el.className='dragghost';el.style.background=palettes[Math.min(drag.n-1,palettes.length-1)];el.innerHTML=Array.from({length:drag.n},()=>'<span></span>').join('');document.body.append(el);document.body.classList.add('dragging');drag.ghost=el}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}});
window.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();document.body.classList.remove('dragging');if(!d.moved)return;const board=document.getElementById('bridge-track');if(board){const r=board.getBoundingClientRect();if(e.clientX>=r.left-28&&e.clientX<=r.right+28&&e.clientY>=r.top-48&&e.clientY<=r.bottom+48){addPiece(d.n,e.clientX)}else{state.feedback='はしの うえに ブロックを はこんでね。';state.feedbackType='info';render()}}/* Some browsers synthesize a click after pointerup. Ignore it. */drag={skipNextClick:true};setTimeout(()=>{if(drag&&drag.skipNextClick)drag=null},50)});
window.addEventListener('pointercancel',()=>{if(drag?.ghost)drag.ghost.remove();document.body.classList.remove('dragging');drag=null});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal!==null){state.modal=null;render()}});
render();
// When opened directly as a local HTML file, no manifest or service worker is required.
if(location.protocol==='file:')document.getElementById('app-manifest').remove();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
